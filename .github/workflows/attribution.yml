name: Source attribution comparison
on:
  pull_request:
    paths:
      - 'scripts/attribution_trial.py'
      - 'examples/attribution-study/**'
      - 'tests/test_attribution.py'
      - 'babalon/last_credit/**'
      - 'babalon/evidence_session.py'
      - '.github/workflows/attribution.yml'
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[last-credit]'
      - run: python -m unittest discover -s tests -p test_attribution.py -v
      - run: |
          python scripts/attribution_trial.py > result.json
          python -c 'import json; r=json.load(open("result.json")); print(json.dumps([r["original"]["totals"],r["review_contrast"]["totals"],r["external"]["correct"]],sort_keys=True))'
      - uses: actions/upload-artifact@v4
        with:
          name: citation-results
          path: result.json
