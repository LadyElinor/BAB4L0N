name: Last-credit paired trial
on:
  pull_request:
    paths:
      - 'babalon/last_credit/**'
      - 'babalon/peer_events.py'
      - 'babalon/evidence_session.py'
      - 'babalon/cli.py'
      - 'tests/test_last_credit.py'
      - 'pyproject.toml'
      - '.github/workflows/last-credit.yml'
permissions:
  contents: read
jobs:
  draw:
    runs-on: ubuntu-latest
    outputs:
      commitment: ${{ steps.commitment.outputs.value }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m babalon last-credit draw --seed "github-run-$GITHUB_RUN_ID" > pack.json
      - id: commitment
        run: python -c 'from babalon.contracts import digest,parse_json; print("value="+digest(parse_json(open("pack.json").read())))' >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: last-credit-pack
          path: pack.json
  evaluate:
    needs: draw
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[last-credit]'
      - uses: actions/download-artifact@v4
        with:
          name: last-credit-pack
      - run: python -m unittest discover -s tests -p test_last_credit.py -v
      - name: Run all arms on the committed draw
        env:
          COMMITMENT: ${{ needs.draw.outputs.commitment }}
        run: |
          python -m babalon last-credit run pack.json --commitment "$COMMITMENT" > report.json
          python -c 'import json; r=json.load(open("report.json")); print(json.dumps({k:r[k] for k in ("seed","pack_digest","case_count","totals")},sort_keys=True))'
      - uses: actions/upload-artifact@v4
        with:
          name: last-credit-results
          path: report.json
