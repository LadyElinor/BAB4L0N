[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "babalon-scaffold"
version = "0.1.0"
description = "A bounded, evidence-aware local agent scaffold"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
babalon = "babalon.cli:main"

[tool.setuptools]
packages = ["babalon"]
